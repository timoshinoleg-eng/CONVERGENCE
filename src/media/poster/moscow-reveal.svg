  <g font-family="ui-monospace" font-size="9" fill="#3e8078">
    <text x="32" y="118">55.7558 N</text>
    <text x="440" y="118" text-anchor="end">37.6173 E</text>
  </g>
  <g fill="none" stroke="#4da99d" stroke-width="1.2" opacity=".85">
    <circle cx="270" cy="320" r="8"/>
    <circle cx="220" cy="290" r="4"/>
