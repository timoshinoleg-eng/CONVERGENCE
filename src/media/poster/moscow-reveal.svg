    <circle cx="200" cy="360" r="4"/>
    <circle cx="350" cy="280" r="4"/>
    <circle cx="260" cy="380" r="4"/>
  </g>
  <g stroke="#214a47" stroke-width=".8" stroke-dasharray="2 4" fill="none" opacity=".9">
