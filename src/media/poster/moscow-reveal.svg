<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Moscow aggregate model poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04110f"/>
      <stop offset="1" stop-color="#02060a"/>
    </linearGradient>
    <pattern id="micro" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#04110f"/>
      <rect width="1" height="1" fill="#10302d"/>
