<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050809" />
    <title>CONVERGENCE</title>
    <script>
      // Telegram requires its official bridge before the application scripts.
      // Load it synchronously only when Telegram launch evidence is present, so
      // standalone browser and Capacitor APK remain offline-first and never
      // block boot on a request to telegram.org.
      (() => {
        const source = `${location.search}&${location.hash}`;
        const hasTelegramParams = /(?:^|[?&#])tgWebApp(?:Version|Platform|Data|StartParam)=/.test(source);
        const hasTelegramTransport = typeof window.TelegramWebviewProxy !== "undefined";
        if (hasTelegramParams || hasTelegramTransport) {
          document.write('<script src="https://telegram.org/js/telegram-web-app.js?63"></scr' + 'ipt>');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
